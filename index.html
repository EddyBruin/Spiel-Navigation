<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPIEL Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { overscroll-behavior-y: contain; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        
        @media (min-width: 768px) {
            .mobile-tabs { display: none; }
            #sidebar { display: flex !important; }
            #map-container { display: flex !important; }
        }
        
        .bg-prio-need { background-color: #dcfce7; border-color: #86efac; }
        .bg-prio-want { background-color: #dbeafe; border-color: #93c5fd; }
        .bg-prio-like { background-color: #fef9c3; border-color: #fde047; }
        .bg-prio-maybe { background-color: #f3f4f6; border-color: #d1d5db; }
        
        .lbl-need { background-color: #22c55e; color: white; }
        .lbl-want { background-color: #3b82f6; color: white; }
        .lbl-like { background-color: #eab308; color: black; }
        .lbl-maybe { background-color: #6b7280; color: white; }
        .lbl-notfound { background-color: #ef4444; color: white; }

        .strike { text-decoration: line-through; opacity: 0.5; }
        .pulse { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-ring { 
            0% { transform: scale(1); opacity: 1; } 
            50% { transform: scale(2.5); opacity: 0.6; } 
            100% { transform: scale(1); opacity: 0; } 
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-3 shadow-md flex justify-between items-center z-20 shrink-0">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-map-location-dot text-blue-400"></i>
            <span>SPIEL Navigator</span>
        </h1>
        <div class="text-xs bg-green-500/20 text-green-300 px-2 py-1 rounded border border-green-500/50">
            <i class="fa-solid fa-check-circle mr-1"></i> PDF Data Actief
        </div>
    </header>

    <!-- Mobile View Tabs -->
    <div class="mobile-tabs flex bg-white border-b shrink-0 shadow-sm z-10">
        <button onclick="switchTab('list')" id="tab-list" class="flex-1 py-3 text-center tab-active text-slate-600 transition-colors">
            <i class="fa-solid fa-list mr-1"></i> Lijst
        </button>
        <button onclick="switchTab('map')" id="tab-map" class="flex-1 py-3 text-center text-slate-600 transition-colors">
            <i class="fa-solid fa-map mr-1"></i> Kaart
        </button>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Sidebar / List -->
        <div id="sidebar" class="w-full md:w-1/3 lg:w-1/4 bg-white border-r flex flex-col h-full z-10 absolute md:relative inset-0">
            
            <!-- Controls -->
            <div class="p-3 border-b bg-white shrink-0 flex flex-col gap-3 shadow-sm">
                
                <!-- Priority Filters -->
                <div class="flex gap-2 text-xs font-bold" id="prio-filters">
                    <label class="flex-1 flex items-center justify-center gap-1 p-2 rounded cursor-pointer bg-green-100 text-green-800 border border-green-300">
                        <input type="checkbox" value="Need" checked class="prio-chk"> Need
                    </label>
                    <label class="flex-1 flex items-center justify-center gap-1 p-2 rounded cursor-pointer bg-blue-100 text-blue-800 border border-blue-300">
                        <input type="checkbox" value="Want" checked class="prio-chk"> Want
                    </label>
                    <label class="flex-1 flex items-center justify-center gap-1 p-2 rounded cursor-pointer bg-yellow-100 text-yellow-800 border border-yellow-300">
                        <input type="checkbox" value="Like" checked class="prio-chk"> Like
                    </label>
                    <label class="flex-1 flex items-center justify-center gap-1 p-2 rounded cursor-pointer bg-gray-100 text-gray-800 border border-gray-300">
                        <input type="checkbox" value="Maybe" checked class="prio-chk"> Maybe
                    </label>
                </div>

                <!-- Toggles -->
                <div class="flex justify-between items-center text-sm font-medium text-slate-700">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="hide-visited" checked class="w-4 h-4 text-blue-600 rounded">
                        Verberg afgevinkt
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="show-all-notes" class="w-4 h-4 text-blue-600 rounded">
                        Toon notities
                    </label>
                </div>
            </div>

            <!-- Hall Tabs -->
            <div class="flex overflow-x-auto border-b bg-slate-50 shrink-0 scrollbar-hide text-sm font-medium" id="hall-tabs">
                <!-- Generated by JS -->
            </div>

            <!-- List -->
            <ul id="game-list" class="overflow-y-auto flex-1 p-2 space-y-2 pb-24 md:pb-2">
                <!-- Generated by JS -->
            </ul>
        </div>

        <!-- Map Area -->
        <div id="map-container" class="w-full md:w-2/3 lg:w-3/4 bg-slate-200 hidden md:flex flex-col relative h-full absolute inset-0">
            <div class="absolute inset-0 overflow-hidden" id="panzoom-wrapper">
                <div id="panzoom-element" class="relative w-full h-full origin-top-left">
                    <img id="map-image" src="" class="absolute top-0 left-0 max-w-none shadow-lg border bg-white hidden" style="transform-origin: top left;">
                    <canvas id="map-overlay" class="absolute top-0 left-0 pointer-events-none"></canvas>
                    <div id="pulse-marker" class="absolute w-20 h-20 border-4 border-blue-500 rounded-full pulse hidden pointer-events-none bg-blue-500/20" style="transform: translate(-50%, -50%);"></div>
                </div>
            </div>
            
            <!-- Map Controls -->
            <div class="absolute bottom-6 right-6 flex flex-col gap-2 z-20">
                <button onclick="zoomIn()" class="bg-white w-12 h-12 rounded-full shadow-lg text-slate-700 hover:text-blue-600 border"><i class="fa-solid fa-plus"></i></button>
                <button onclick="zoomOut()" class="bg-white w-12 h-12 rounded-full shadow-lg text-slate-700 hover:text-blue-600 border"><i class="fa-solid fa-minus"></i></button>
                <button onclick="fitMap()" class="bg-white w-12 h-12 rounded-full shadow-lg text-slate-700 hover:text-blue-600 border"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>
    </main>

    <!-- Modal for Map Clicks -->
    <div id="booth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[80vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h3 class="font-bold text-lg" id="modal-title">Stands</h3>
                <button onclick="closeModal()" class="text-slate-500 hover:text-slate-800"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-3" id="modal-content"></div>
        </div>
    </div>

    <!-- Error/Upload Overlay -->
    <div id="upload-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center">
            <i class="fa-solid fa-file-csv text-5xl text-blue-500 mb-4"></i>
            <h2 class="text-xl font-bold mb-2">Data niet gevonden</h2>
            <p class="text-sm text-slate-600 mb-4">Laad handmatig een CSV bestand in.</p>

            <label for="csv-file" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium cursor-pointer block">Kies Bestand</label>
        </div>
    </div>

        let games = [];
        let visited = JSON.parse(localStorage.getItem('spielVisited') || '[]');
        let userNotes = JSON.parse(localStorage.getItem('spielNotes') || '{}');
        let currentHall = '1';
        let panzoomInstance = null;
        let pointerDownPos = { x: 0, y: 0 };
        let activePriorities = ['Need', 'Want', 'Like', 'Maybe'];

        document.addEventListener('DOMContentLoaded', () => {
            initPanzoom();
            setupEventListeners();
            attemptAutoLoadCSV();
        });

        function attemptAutoLoadCSV() {
            fetch('data.csv')
                .then(r => { if (!r.ok) throw new Error(); return r.text(); })
                .then(processCSV)
                .catch(() => document.getElementById('upload-overlay').classList.remove('hidden'));
        }

        document.getElementById('csv-file').addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = evt => processCSV(evt.target.result);
                reader.readAsText(e.target.files[0]);
            }
        });

        function processCSV(csvText) {
            document.getElementById('upload-overlay').classList.add('hidden');
            Papa.parse(csvText, {
                header: true, skipEmptyLines: true,
                complete: results => {
                    games = results.data.map((row, idx) => {
                        const hall = row['hall'] ? row['hall'].replace('.0', '').trim() : '';
                        const booth = row['booth'] ? row['booth'].trim() : '';
                        return {
                            id: `g_${idx}`,
                            name: row['name'],
                            publisher: row['publishers'],
                            hall: hall,
                            boothLabel: hall && booth ? `${hall}${booth}` : '',
                            priority: row['priority'],
                            preorder: row['preorder'] === '1',
                            notes: row['notes'] || ''
                        };
                    });
                    
                    games.sort((a, b) => {
                        if (prioOrder[a.priority] !== prioOrder[b.priority]) return (prioOrder[a.priority] || 9) - (prioOrder[b.priority] || 9);
                        if (a.hall !== b.hall) return a.hall.localeCompare(b.hall);
                        return a.boothLabel.localeCompare(b.boothLabel);
                    });

                    currentHall = '1';
                    renderHallTabs();
                    loadMapImage();
                }
            });
        }

        function getPrioStyles(prio) {
            switch(prio) {
                case 'Need': return { bg: 'bg-prio-need', lbl: 'lbl-need', hex: 'rgba(34, 197, 94, 0.85)' }; // More solid colors
                case 'Want': return { bg: 'bg-prio-want', lbl: 'lbl-want', hex: 'rgba(59, 130, 246, 0.85)' };
                case 'Like': return { bg: 'bg-prio-like', lbl: 'lbl-like', hex: 'rgba(234, 179, 8, 0.90)' };
                case 'Maybe': return { bg: 'bg-prio-maybe', lbl: 'lbl-maybe', hex: 'rgba(107, 114, 128, 0.85)' };
                default: return { bg: 'bg-white', lbl: 'bg-slate-500 text-white', hex: 'rgba(148, 163, 184, 0.85)' };
            }
        }

        function updateActivePriorities() {
            activePriorities = Array.from(document.querySelectorAll('.prio-chk:checked')).map(cb => cb.value);
            renderHallTabs();
            renderList();
            drawOverlay();
        }

        function renderHallTabs() {
            const container = document.getElementById('hall-tabs');
            container.innerHTML = '';
            const hideChecked = document.getElementById('hide-visited').checked;
            
            for (let i = 1; i <= 8; i++) {
                const hallStr = i.toString();
                const count = games.filter(g => 
                    g.hall === hallStr && 
                    (!hideChecked || !visited.includes(g.id)) &&
                    activePriorities.includes(g.priority)
                ).length;
                
                const btn = document.createElement('button');
                btn.className = `flex-none px-4 py-3 transition-colors border-b-2 ${currentHall === hallStr ? 'border-blue-600 text-blue-600 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-200'}`;
                btn.innerHTML = `Hal ${i} <span class="ml-1 text-xs bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded-full">${count}</span>`;
                btn.onclick = () => { currentHall = hallStr; renderHallTabs(); loadMapImage(); };
                container.appendChild(btn);
            }
        }

        function renderList() {
            const list = document.getElementById('game-list');
            list.innerHTML = '';
            const hideChecked = document.getElementById('hide-visited').checked;
            const showAllNotes = document.getElementById('show-all-notes').checked;
            
            const hallGames = games.filter(g => g.hall === currentHall && activePriorities.includes(g.priority));
            let count = 0;

            hallGames.forEach(game => {
                const isVis = visited.includes(game.id);
                if (hideChecked && isVis) return;
                count++;

                const styles = getPrioStyles(game.priority);
                let labelStyle = styles.lbl;
                
                // Check vector data directly
                if (game.boothLabel && pdfBoothData[currentHall]) {
                    const search = game.boothLabel.replace(/[^a-zA-Z0-9]/g, '');
                    const found = Object.keys(pdfBoothData[currentHall]).some(k => k.includes(search) || search.includes(k));
                    if (!found && Object.keys(pdfBoothData[currentHall]).length > 0) labelStyle = 'lbl-notfound';
                }

                const note = userNotes[game.id] !== undefined ? userNotes[game.id] : game.notes;
                
                const li = document.createElement('li');
                li.className = `p-3 rounded-lg border shadow-sm transition-all ${isVis ? 'opacity-50 grayscale bg-white' : styles.bg}`;
                li.innerHTML = `
                    <div class="flex items-start gap-3">
                        <input type="checkbox" ${isVis ? 'checked' : ''} onchange="toggleVis('${game.id}')" class="mt-1 w-5 h-5 cursor-pointer shrink-0">
                        <div class="flex-1 min-w-0" onclick="toggleNote('${game.id}')">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="font-bold text-slate-800 truncate ${isVis ? 'strike' : ''}">${game.name}</h3>
                                ${game.preorder ? '<i class="fa-solid fa-money-bill-wave text-green-600"></i>' : ''}
                            </div>
                            <p class="text-sm text-slate-600 truncate mb-2">${game.publisher}</p>
                            <div class="flex gap-2">
                                <button onclick="focusMap('${game.boothLabel}'); event.stopPropagation();" class="text-xs px-2 py-1 rounded font-bold shadow-sm ${labelStyle}">
                                    <i class="fa-solid fa-location-dot"></i> ${game.boothLabel}
                                </button>
                                <span class="text-xs bg-white/60 text-slate-700 px-2 py-1 rounded border font-medium">${game.priority}</span>
                            </div>
                            <textarea id="note-${game.id}" onchange="saveNote('${game.id}', this.value)" onclick="event.stopPropagation()" class="w-full mt-3 text-sm p-2 border rounded bg-white/80 outline-none ${showAllNotes ? '' : 'hidden'}" rows="2">${note}</textarea>
                        </div>
                    </div>`;
                list.appendChild(li);
            });
            if(count === 0) list.innerHTML = `<li class="p-4 text-center text-slate-500 italic">Geen spellen gevonden.</li>`;
        }

        function toggleVis(id) {
            visited = visited.includes(id) ? visited.filter(v => v !== id) : [...visited, id];
            localStorage.setItem('spielVisited', JSON.stringify(visited));
            renderHallTabs(); renderList(); drawOverlay();
        }

        function toggleNote(id) {
            if(!document.getElementById('show-all-notes').checked) {
                document.getElementById(`note-${id}`).classList.toggle('hidden');
            }
        }
        function saveNote(id, val) { userNotes[id] = val; localStorage.setItem('spielNotes', JSON.stringify(userNotes)); }

        function switchTab(tab) {
            document.getElementById('tab-list').classList.toggle('tab-active', tab === 'list');
            document.getElementById('tab-map').classList.toggle('tab-active', tab === 'map');
            
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').style.display = tab === 'list' ? 'flex' : 'none';
                document.getElementById('map-container').style.display = tab === 'map' ? 'flex' : 'none';
                if(tab === 'map') setTimeout(fitMap, 50);
            }
        }

        function setupEventListeners() {
            document.querySelectorAll('.prio-chk').forEach(cb => cb.addEventListener('change', updateActivePriorities));
            document.getElementById('hide-visited').addEventListener('change', () => { renderHallTabs(); renderList(); drawOverlay(); });
            document.getElementById('show-all-notes').addEventListener('change', renderList);
            
            window.addEventListener('resize', () => {
                document.getElementById('sidebar').style.display = '';
                document.getElementById('map-container').style.display = '';
                drawOverlay();
            });

            const wrap = document.getElementById('panzoom-wrapper');
            wrap.addEventListener('pointerdown', e => pointerDownPos = { x: e.clientX, y: e.clientY });
            wrap.addEventListener('pointerup', e => { if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) < 5) handleMapClick(e); });
        }

        // --- Map Zoom & Focus ---
        function initPanzoom() {
            const el = document.getElementById('panzoom-element');
            panzoomInstance = Panzoom(el, { maxScale: 5, minScale: 0.1, contain: 'outside', startScale: 1 });
            el.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
        }

        function fitMap() {
            const img = document.getElementById('map-image');
            const wrap = document.getElementById('panzoom-wrapper');
            if(!img || img.classList.contains('hidden') || wrap.clientWidth === 0) return;
            
            const scaleX = wrap.clientWidth / img.naturalWidth;
            const scaleY = wrap.clientHeight / img.naturalHeight;
            const fitScale = Math.min(scaleX, scaleY) * 0.95; 
            
            panzoomInstance.setOptions({ minScale: fitScale / 2 });
            panzoomInstance.zoom(fitScale, { animate: true });
            setTimeout(() => panzoomInstance.pan(0, 0, { animate: true }), 50);
            drawOverlay();
        }

        function zoomIn() { panzoomInstance.zoomIn(); }
        function zoomOut() { panzoomInstance.zoomOut(); }

        function loadMapImage() {
            const img = document.getElementById('map-image');
            img.onload = () => {
                img.classList.remove('hidden');
                const cvs = document.getElementById('map-overlay');
                cvs.width = img.naturalWidth; cvs.height = img.naturalHeight;
                cvs.style.width = `${img.naturalWidth}px`; cvs.style.height = `${img.naturalHeight}px`;
                
                const wrap = document.getElementById('panzoom-element');
                wrap.style.width = `${img.naturalWidth}px`; wrap.style.height = `${img.naturalHeight}px`;

                fitMap();
                renderList();
            };
            img.src = `hal${currentHall}.png`;
        }

        function focusMap(boothLabel) {
            if(!boothLabel) return;
            const searchStr = boothLabel.replace(/[^a-zA-Z0-9]/g, '');
            const hallData = pdfBoothData[currentHall] || {};
            
            const target = Object.entries(hallData).find(([k]) => k.includes(searchStr) || searchStr.includes(k))?.[1];

            if(target) {
                switchTab('map');
                requestAnimationFrame(() => {
                    const img = document.getElementById('map-image');
                    const wrap = document.getElementById('panzoom-wrapper');
                    
                    const pxX = (target.x / 100) * img.naturalWidth;
                    const pxY = (target.y / 100) * img.naturalHeight;
                    
                    const pulse = document.getElementById('pulse-marker');
                    pulse.style.left = `${pxX}px`; pulse.style.top = `${pxY}px`;
                    pulse.classList.remove('hidden');
                    
                    const scale = 3; // Zooms in closer to the target
                    const panX = (wrap.clientWidth / 2) - (pxX * scale);
                    const panY = (wrap.clientHeight / 2) - (pxY * scale);

                    panzoomInstance.zoom(scale, { animate: true });
                    setTimeout(() => panzoomInstance.pan(panX, panY, { animate: true, force: true }), 50);
                    setTimeout(() => pulse.classList.add('hidden'), 3000);
                });
            } else {
                alert(`Locatie '${boothLabel}' niet gevonden in de PDF data.`);
            }
        }

        // --- Drawing Overlays ---
        function drawOverlay() {
            const cvs = document.getElementById('map-overlay');
            const img = document.getElementById('map-image');
            if (img.classList.contains('hidden') || !pdfBoothData[currentHall]) return;

            const ctx = cvs.getContext('2d');
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            
            const hide = document.getElementById('hide-visited').checked;
            const hGames = games.filter(g => g.hall === currentHall && (!hide || !visited.includes(g.id)) && activePriorities.includes(g.priority));

            hGames.forEach(game => {
                if (!game.boothLabel) return;
                const searchStr = game.boothLabel.replace(/[^a-zA-Z0-9]/g, '');
                
                const match = Object.entries(pdfBoothData[currentHall]).find(([k]) => k.includes(searchStr) || searchStr.includes(k));
                if(match) {
                    const box = match[1];
                    const pxX = (box.x / 100) * cvs.width;
                    const pxY = (box.y / 100) * cvs.height;
                    const pxW = (box.w / 100) * cvs.width;
                    const pxH = (box.h / 100) * cvs.height;

                    // Large padding to completely cover the booth block
                    const padW = Math.max(pxW * 1.5, 45); 
                    const padH = Math.max(pxH * 1.5, 30);

                    ctx.fillStyle = getPrioStyles(game.priority).hex;
                    ctx.fillRect(pxX - padW, pxY - padH, pxW + (padW*2), pxH + (padH*2));
                    
                    ctx.strokeStyle = getPrioStyles(game.priority).hex.replace(/[\d.]+\)$/g, '1)'); // Full opacity border
                    ctx.lineWidth = 5;
                    ctx.strokeRect(pxX - padW, pxY - padH, pxW + (padW*2), pxH + (padH*2));
                }
            });
        }

        function handleMapClick(e) {
            const img = document.getElementById('map-image');
            if(img.classList.contains('hidden')) return;

            const rect = img.getBoundingClientRect();
            const pctX = ((e.clientX - rect.left) * (img.naturalWidth / rect.width) / img.naturalWidth) * 100;
            const pctY = ((e.clientY - rect.top) * (img.naturalHeight / rect.height) / img.naturalHeight) * 100;

            const hallData = pdfBoothData[currentHall] || {};
            let clicked = null;

            for (const [text, box] of Object.entries(hallData)) {
                const padW = box.w * 2; const padH = box.h * 2;
                if (pctX >= (box.x - padW) && pctX <= (box.x + box.w + padW) && pctY >= (box.y - padH) && pctY <= (box.y + box.h + padH)) {
                    clicked = text; break;
                }
            }

            if (clicked) {
                const match = games.filter(g => g.hall === currentHall && g.boothLabel && 
                    (clicked.includes(g.boothLabel.replace(/[^a-zA-Z0-9]/g, '')) || g.boothLabel.replace(/[^a-zA-Z0-9]/g, '').includes(clicked))
                );
                if(match.length > 0) showModal(match);
            }
        }

        function showModal(matchGames) {
            const content = document.getElementById('modal-content');
            content.innerHTML = '';
            document.getElementById('modal-title').innerText = `Stands: ${matchGames[0].boothLabel}`;

            matchGames.forEach(game => {
                const isVis = visited.includes(game.id);
                const note = userNotes[game.id] !== undefined ? userNotes[game.id] : game.notes;
                const bg = getPrioStyles(game.priority).bg;

                content.innerHTML += `
                    <div class="p-3 rounded border ${bg} ${isVis ? 'opacity-50 grayscale bg-white' : ''}">
                        <div class="flex items-start gap-2">
                            <input type="checkbox" ${isVis ? 'checked' : ''} onchange="toggleVis('${game.id}'); closeModal();" class="mt-1 w-5 h-5 cursor-pointer">
                            <div class="flex-1">
                                <h4 class="font-bold ${isVis ? 'strike' : ''}">${game.name}</h4>
                                <p class="text-xs text-slate-600 mb-2">${game.publisher}</p>
                                <span class="text-xs px-2 py-1 rounded bg-white/60 border font-bold">${game.priority}</span>
                                <textarea onchange="saveNote('${game.id}', this.value)" class="w-full mt-2 text-sm p-2 border rounded bg-white/80" rows="2">${note}</textarea>
                            </div>
                        </div>
                    </div>`;
            });
            document.getElementById('booth-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('booth-modal').classList.add('hidden'); }
    </script>
</body>
</html>
