<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPIEL Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { overscroll-behavior-y: contain; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        .hidden-mobile { display: none; }
        @media (min-width: 768px) {
            .hidden-mobile { display: flex !important; }
            .mobile-tabs { display: none; }
            #sidebar { display: flex !important; }
            #map-container { display: flex !important; }
        }
        
        .bg-prio-need { background-color: #dcfce7; }
        .bg-prio-want { background-color: #dbeafe; }
        .bg-prio-like { background-color: #fef9c3; }
        .bg-prio-maybe { background-color: #f3f4f6; }
        
        .lbl-need { background-color: #22c55e; color: white; }
        .lbl-want { background-color: #3b82f6; color: white; }
        .lbl-like { background-color: #eab308; color: black; }
        .lbl-maybe { background-color: #6b7280; color: white; }
        .lbl-notfound { background-color: #ef4444; color: white; }

        .strike { text-decoration: line-through; opacity: 0.6; }
        .pulse { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-ring { 
            0% { transform: scale(1); opacity: 1; } 
            50% { transform: scale(2); opacity: 0.5; } 
            100% { transform: scale(1); opacity: 0; } 
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-3 shadow-md flex justify-between items-center z-20 shrink-0">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-map-location-dot text-blue-400"></i>
            <span id="txt-title">SPIEL Navigator</span>
        </h1>
        <div class="flex items-center gap-2 text-sm bg-slate-800 rounded-lg p-1">
            <button onclick="setLang('nl')" id="lang-nl" class="px-2 py-1 rounded font-bold">NL</button>
            <button onclick="setLang('en')" id="lang-en" class="px-2 py-1 rounded">EN</button>
            <button onclick="setLang('de')" id="lang-de" class="px-2 py-1 rounded">DE</button>
        </div>
    </header>

    <!-- Mobile View Tabs -->
    <div class="mobile-tabs flex bg-white border-b shrink-0 shadow-sm z-10">
        <button onclick="switchTab('list')" id="tab-list" class="flex-1 py-3 text-center tab-active text-slate-600 transition-colors">
            <i class="fa-solid fa-list mr-1"></i> <span id="txt-tab-list">Lijst</span>
        </button>
        <button onclick="switchTab('map')" id="tab-map" class="flex-1 py-3 text-center text-slate-600 transition-colors">
            <i class="fa-solid fa-map mr-1"></i> <span id="txt-tab-map">Kaart</span>
        </button>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Sidebar / List -->
        <div id="sidebar" class="w-full md:w-1/3 lg:w-1/4 bg-white border-r flex flex-col h-full z-10 absolute md:relative inset-0">
            
            <!-- Controls (Restored & Enhanced) -->
            <div class="p-3 border-b bg-slate-100 shrink-0 flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
                        <input type="checkbox" id="hide-visited" checked class="w-4 h-4 text-blue-600 rounded">
                        <span id="txt-hide">Verberg afgevinkt</span>
                    </label>
                    <div id="ocr-status" class="text-xs text-blue-600 font-bold hidden bg-blue-100 px-2 py-1 rounded">
                        <i class="fa-solid fa-spinner fa-spin mr-1"></i> <span id="txt-scanning">OCR: 0%</span>
                    </div>
                </div>
                
                <div class="flex justify-between items-center">
                    <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer">
                        <input type="checkbox" id="show-all-notes" class="w-4 h-4 text-blue-600 rounded">
                        <span id="txt-show-notes">Toon alle notities</span>
                    </label>
                    <select id="prio-filter" class="text-sm p-1 border rounded bg-white font-medium text-slate-700 outline-none">
                        <option value="All" id="txt-prio-all">Alle Prioriteiten</option>
                        <option value="Need">Need</option>
                        <option value="Want">Want</option>
                        <option value="Like">Like</option>
                        <option value="Maybe">Maybe</option>
                    </select>
                </div>
            </div>

            <!-- Hall Tabs -->
            <div class="flex overflow-x-auto border-b bg-slate-50 shrink-0 scrollbar-hide text-sm" id="hall-tabs">
                <!-- Tabs generated by JS -->
            </div>

            <!-- List -->
            <ul id="game-list" class="overflow-y-auto flex-1 p-2 space-y-2 pb-24 md:pb-2">
                <!-- List items generated by JS -->
            </ul>
        </div>

        <!-- Map Area -->
        <div id="map-container" class="w-full md:w-2/3 lg:w-3/4 bg-slate-200 hidden md:flex flex-col relative h-full absolute inset-0">
            <div class="absolute inset-0 overflow-hidden" id="panzoom-wrapper">
                <div id="panzoom-element" class="relative w-full h-full origin-top-left">
                    <img id="map-image" src="" class="absolute top-0 left-0 max-w-none shadow-lg border bg-white hidden" style="transform-origin: top left;">
                    <canvas id="map-overlay" class="absolute top-0 left-0 pointer-events-none"></canvas>
                    <div id="pulse-marker" class="absolute w-12 h-12 border-4 border-red-500 rounded-full pulse hidden pointer-events-none" style="transform: translate(-50%, -50%);"></div>
                </div>
            </div>
            
            <!-- Map Controls -->
            <div class="absolute bottom-6 right-6 flex flex-col gap-2 z-20">
                <button onclick="zoomIn()" class="bg-white p-3 rounded-full shadow-lg text-slate-700 hover:text-blue-600"><i class="fa-solid fa-plus"></i></button>
                <button onclick="zoomOut()" class="bg-white p-3 rounded-full shadow-lg text-slate-700 hover:text-blue-600"><i class="fa-solid fa-minus"></i></button>
                <button onclick="resetZoom()" class="bg-white p-3 rounded-full shadow-lg text-slate-700 hover:text-blue-600"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>

    </main>

    <!-- File Upload Fallback -->
    <div id="upload-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center">
            <i class="fa-solid fa-file-csv text-5xl text-blue-500 mb-4"></i>
            <h2 class="text-xl font-bold mb-2">CSV Upload</h2>
            <p class="text-sm text-slate-600 mb-4" id="txt-upload-desc">Sleep je CSV bestand hierheen of selecteer het bestand.</p>
            <input type="file" id="csv-file" accept=".csv" class="hidden">
            <label for="csv-file" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium cursor-pointer hover:bg-blue-700 block">Kies Bestand</label>
        </div>
    </div>

    <!-- Modal for Map Clicks -->
    <div id="booth-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[80vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50 rounded-t-xl">
                <h3 class="font-bold text-lg" id="modal-title">Booth Games</h3>
                <button onclick="closeModal()" class="text-slate-500 hover:text-slate-800"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex-1 space-y-3" id="modal-content">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <script>
        // --- Translations ---
        const i18n = {
            'nl': {
                title: "SPIEL Navigator", tabList: "Lijst", tabMap: "Kaart", hideVisited: "Verberg afgevinkt",
                showNotes: "Toon alle notities", prioAll: "Alle Prioriteiten",
                scanning: "OCR Bezig...", hall: "Hal", uploadDesc: "Kon data.csv niet automatisch inladen. Upload handmatig.",
                notes: "Notities...", preorder: "Preorder", noGames: "Geen spellen in deze weergave."
            },
            'en': {
                title: "SPIEL Navigator", tabList: "List", tabMap: "Map", hideVisited: "Hide visited",
                showNotes: "Show all notes", prioAll: "All Priorities",
                scanning: "OCR Running...", hall: "Hall", uploadDesc: "Could not auto-load data.csv. Please upload manually.",
                notes: "Notes...", preorder: "Preorder", noGames: "No games in this view."
            },
            'de': {
                title: "SPIEL Navigator", tabList: "Liste", tabMap: "Karte", hideVisited: "Besuchte ausblenden",
                showNotes: "Alle Notizen anzeigen", prioAll: "Alle Prioritäten",
                scanning: "OCR läuft...", hall: "Halle", uploadDesc: "data.csv konnte nicht geladen werden. Bitte manuell hochladen.",
                notes: "Notizen...", preorder: "Vorbestellung", noGames: "Keine Spiele in dieser Ansicht."
            }
        };

        const prioOrder = { 'Need': 1, 'Want': 2, 'Like': 3, 'Maybe': 4 };

        // --- State ---
        let lang = 'nl';
        let games = [];
        let visited = JSON.parse(localStorage.getItem('spielVisited') || '[]');
        let userNotes = JSON.parse(localStorage.getItem('spielNotes') || '{}');
        let ocrCache = JSON.parse(localStorage.getItem('spielOcrCacheV4') || '{}');
        let currentHall = '1';
        let panzoomInstance = null;
        let isOcrRunning = false;
        let pointerDownPos = { x: 0, y: 0 };

        // 10 OCR Filters for deep scanning
        const ocrFilters = [
            'grayscale(100%) contrast(200%)', // Default high contrast
            'invert(100%) grayscale(100%) contrast(200%)', // Inverted logic
            'contrast(150%) brightness(90%)',
            'grayscale(100%) brightness(150%) contrast(250%)',
            'blur(0.5px) contrast(300%) grayscale(100%)', // Smoothens artifacts
            'saturate(0) contrast(400%)',
            'sepia(100%) contrast(200%)',
            'grayscale(100%) contrast(150%) brightness(120%)',
            'invert(100%) contrast(300%)',
            'none' // Raw fallback
        ];

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initPanzoom();
            setupEventListeners();
            setLang('nl');
            attemptAutoLoadCSV();
        });

        function setLang(l) {
            lang = l;
            document.querySelectorAll('#lang-nl, #lang-en, #lang-de').forEach(el => el.classList.remove('bg-blue-600', 'text-white'));
            document.getElementById(`lang-${l}`).classList.add('bg-blue-600', 'text-white');
            
            document.getElementById('txt-title').innerText = i18n[l].title;
            document.getElementById('txt-tab-list').innerText = i18n[l].tabList;
            document.getElementById('txt-tab-map').innerText = i18n[l].tabMap;
            document.getElementById('txt-hide').innerText = i18n[l].hideVisited;
            document.getElementById('txt-show-notes').innerText = i18n[l].showNotes;
            document.getElementById('txt-prio-all').innerText = i18n[l].prioAll;
            document.getElementById('txt-scanning').innerText = i18n[l].scanning;
            document.getElementById('txt-upload-desc').innerText = i18n[l].uploadDesc;
            
            if (games.length > 0) {
                renderHallTabs();
                renderList();
            }
        }

        // --- File Handling ---
        function attemptAutoLoadCSV() {
            fetch('data.csv')
                .then(response => {
                    if (!response.ok) throw new Error('Not found');
                    return response.text();
                })
                .then(csv => processCSV(csv))
                .catch(() => {
                    document.getElementById('upload-overlay').classList.remove('hidden');
                });
        }

        document.getElementById('csv-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => processCSV(evt.target.result);
                reader.readAsText(file);
            }
        });

        function processCSV(csvText) {
            document.getElementById('upload-overlay').classList.add('hidden');
            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    games = results.data.map((row, idx) => {
                        const hall = row['hall'] ? row['hall'].replace('.0', '').trim() : '';
                        const booth = row['booth'] ? row['booth'].trim() : '';
                        return {
                            id: `game_${idx}`,
                            name: row['name'],
                            publisher: row['publishers'],
                            hall: hall,
                            boothLabel: hall && booth ? `${hall}${booth}` : '',
                            priority: row['priority'],
                            preorder: row['preorder'] === '1',
                            notes: row['notes'] || ''
                        };
                    });
                    
                    games.sort((a, b) => {
                        if (prioOrder[a.priority] !== prioOrder[b.priority]) {
                            return (prioOrder[a.priority] || 9) - (prioOrder[b.priority] || 9);
                        }
                        if (a.hall !== b.hall) return a.hall.localeCompare(b.hall);
                        return a.boothLabel.localeCompare(b.boothLabel);
                    });

                    checkAndRunAdvancedOCR(); // Start multi-pass OCR
                    currentHall = '1';
                    renderHallTabs();
                    loadMapImage();
                }
            });
        }

        // --- UI Rendering ---
        function getPrioStyles(priority) {
            switch(priority) {
                case 'Need': return { bg: 'bg-prio-need', border: 'border-green-300', lbl: 'lbl-need', hex: 'rgba(34, 197, 94, 0.4)' };
                case 'Want': return { bg: 'bg-prio-want', border: 'border-blue-300', lbl: 'lbl-want', hex: 'rgba(59, 130, 246, 0.4)' };
                case 'Like': return { bg: 'bg-prio-like', border: 'border-yellow-300', lbl: 'lbl-like', hex: 'rgba(234, 179, 8, 0.4)' };
                case 'Maybe': return { bg: 'bg-prio-maybe', border: 'border-gray-300', lbl: 'lbl-maybe', hex: 'rgba(107, 114, 128, 0.4)' };
                default: return { bg: 'bg-white', border: 'border-slate-200', lbl: 'bg-slate-500 text-white', hex: 'rgba(148, 163, 184, 0.4)' };
            }
        }

        function renderHallTabs() {
            const tabsContainer = document.getElementById('hall-tabs');
            tabsContainer.innerHTML = '';
            const hideChecked = document.getElementById('hide-visited').checked;
            const currentPrio = document.getElementById('prio-filter').value;
            
            for (let i = 1; i <= 8; i++) {
                const hallStr = i.toString();
                const count = games.filter(g => 
                    g.hall === hallStr && 
                    (!hideChecked || !visited.includes(g.id)) &&
                    (currentPrio === 'All' || g.priority === currentPrio)
                ).length;
                
                const btn = document.createElement('button');
                btn.className = `flex-none px-4 py-3 font-medium transition-colors border-b-2 ${currentHall === hallStr ? 'border-blue-600 text-blue-600 bg-white' : 'border-transparent text-slate-600 hover:bg-slate-200'}`;
                btn.innerHTML = `${i18n[lang].hall} ${i} <span class="ml-1 text-xs bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded-full">${count}</span>`;
                btn.onclick = () => {
                    currentHall = hallStr;
                    renderHallTabs();
                    loadMapImage();
                };
                tabsContainer.appendChild(btn);
            }
        }

        function renderList() {
            const list = document.getElementById('game-list');
            list.innerHTML = '';
            const hideChecked = document.getElementById('hide-visited').checked;
            const showAllNotes = document.getElementById('show-all-notes').checked;
            const currentPrio = document.getElementById('prio-filter').value;
            
            const hallGames = games.filter(g => 
                g.hall === currentHall &&
                (currentPrio === 'All' || g.priority === currentPrio)
            );
            let visibleCount = 0;

            hallGames.forEach(game => {
                const isVisited = visited.includes(game.id);
                if (hideChecked && isVisited) return;
                visibleCount++;

                const styles = getPrioStyles(game.priority);
                const hallOcr = ocrCache[currentHall] || {};
                let labelStyle = styles.lbl;
                let found = false;
                
                if (game.boothLabel) {
                    const searchStr = game.boothLabel.replace(/[^a-zA-Z0-9]/g, '');
                    for (const key of Object.keys(hallOcr)) {
                        if (key.includes(searchStr) || searchStr.includes(key)) {
                            found = true; break;
                        }
                    }
                }
                
                // Only show red if we have OCR data for this hall but couldn't find the specific booth
                if (game.boothLabel && !found && Object.keys(hallOcr).length > 0) {
                    labelStyle = 'lbl-notfound';
                }

                const savedNote = userNotes[game.id] !== undefined ? userNotes[game.id] : game.notes;
                
                const li = document.createElement('li');
                li.className = `p-3 rounded-lg border shadow-sm transition-all ${isVisited ? 'opacity-50 grayscale bg-white' : styles.bg} ${styles.border}`;
                
                li.innerHTML = `
                    <div class="flex items-start gap-3">
                        <input type="checkbox" ${isVisited ? 'checked' : ''} onchange="toggleVisited('${game.id}')" class="mt-1 w-5 h-5 text-blue-600 rounded cursor-pointer shrink-0">
                        <div class="flex-1 min-w-0" onclick="toggleNote('${game.id}')">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="font-bold text-slate-800 truncate ${isVisited ? 'strike' : ''}">${game.name}</h3>
                                ${game.preorder ? '<i class="fa-solid fa-money-bill-wave text-green-600 ml-2" title="Preorder"></i>' : ''}
                            </div>
                            <p class="text-sm text-slate-600 truncate mb-2">${game.publisher || '-'}</p>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="focusMap('${game.boothLabel}'); event.stopPropagation();" class="text-xs px-2 py-1 rounded font-bold shadow-sm ${labelStyle}">
                                    <i class="fa-solid fa-location-dot mr-1"></i> ${game.boothLabel || '?'}
                                </button>
                                <span class="text-xs bg-white/60 text-slate-700 px-2 py-1 rounded border border-slate-300 font-medium">
                                    ${game.priority}
                                </span>
                            </div>
                            
                            <div id="note-${game.id}" class="mt-3 ${showAllNotes ? '' : 'hidden'}">
                                <textarea onchange="saveNote('${game.id}', this.value)" onclick="event.stopPropagation()" class="w-full text-sm p-2 border rounded bg-white/80 focus:ring-2 focus:ring-blue-500 outline-none" rows="2" placeholder="${i18n[lang].notes}">${savedNote}</textarea>
                            </div>
                        </div>
                    </div>
                `;
                list.appendChild(li);
            });

            if (visibleCount === 0) {
                list.innerHTML = `<li class="p-4 text-center text-slate-500 italic">${i18n[lang].noGames}</li>`;
            }
        }

        // --- Interactivity ---
        function toggleVisited(id) {
            if (visited.includes(id)) {
                visited = visited.filter(v => v !== id);
            } else {
                visited.push(id);
            }
            localStorage.setItem('spielVisited', JSON.stringify(visited));
            renderHallTabs();
            renderList();
            drawOverlay();
        }

        function toggleNote(id) {
            if(!document.getElementById('show-all-notes').checked) {
                const el = document.getElementById(`note-${id}`);
                el.classList.toggle('hidden');
            }
        }

        function saveNote(id, val) {
            userNotes[id] = val;
            localStorage.setItem('spielNotes', JSON.stringify(userNotes));
        }

        function switchTab(tab) {
            document.getElementById('tab-list').classList.toggle('tab-active', tab === 'list');
            document.getElementById('tab-map').classList.toggle('tab-active', tab === 'map');
            
            const sidebar = document.getElementById('sidebar');
            const mapCont = document.getElementById('map-container');
            
            if (window.innerWidth < 768) {
                if (tab === 'list') {
                    sidebar.style.display = 'flex';
                    mapCont.style.display = 'none';
                } else {
                    sidebar.style.display = 'none';
                    mapCont.style.display = 'flex';
                    // Re-calculate bounds slightly after showing
                    setTimeout(() => { if(panzoomInstance) panzoomInstance.pan(0,0); }, 50);
                }
            }
        }

        document.getElementById('hide-visited').addEventListener('change', () => { renderHallTabs(); renderList(); drawOverlay(); });
        document.getElementById('show-all-notes').addEventListener('change', renderList);
        document.getElementById('prio-filter').addEventListener('change', () => { renderHallTabs(); renderList(); drawOverlay(); });

        function setupEventListeners() {
            window.addEventListener('resize', () => {
                document.getElementById('sidebar').style.display = '';
                document.getElementById('map-container').style.display = '';
                drawOverlay();
            });

            const mapWrap = document.getElementById('panzoom-wrapper');
            mapWrap.addEventListener('pointerdown', e => { pointerDownPos = { x: e.clientX, y: e.clientY }; });
            mapWrap.addEventListener('pointerup', e => {
                const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (dist < 5) handleMapClick(e);
            });
        }

        // --- Map & Panzoom ---
        function initPanzoom() {
            const elem = document.getElementById('panzoom-element');
            panzoomInstance = Panzoom(elem, {
                maxScale: 5,
                minScale: 0.5,
                contain: 'outside',
                canvas: true
            });
            elem.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
        }

        function zoomIn() { panzoomInstance.zoomIn(); }
        function zoomOut() { panzoomInstance.zoomOut(); }
        function resetZoom() { panzoomInstance.reset(); setTimeout(drawOverlay, 50); }

        function loadMapImage() {
            const img = document.getElementById('map-image');
            img.onload = () => {
                img.classList.remove('hidden');
                const cvs = document.getElementById('map-overlay');
                cvs.width = img.naturalWidth;
                cvs.height = img.naturalHeight;
                cvs.style.width = `${img.naturalWidth}px`;
                cvs.style.height = `${img.naturalHeight}px`;
                
                const wrapper = document.getElementById('panzoom-element');
                wrapper.style.width = `${img.naturalWidth}px`;
                wrapper.style.height = `${img.naturalHeight}px`;

                panzoomInstance.reset();
                renderList();
                drawOverlay();
            };
            img.src = `hal${currentHall}.png`;
        }

        // --- Focus Fix ---
        function focusMap(boothLabel) {
            if(!boothLabel) return;
            const searchStr = boothLabel.replace(/[^a-zA-Z0-9]/g, '');
            const hallOcr = ocrCache[currentHall] || {};
            
            let target = null;
            for (const [key, val] of Object.entries(hallOcr)) {
                if (key.includes(searchStr) || searchStr.includes(key)) {
                    target = val; break;
                }
            }

            if(target) {
                switchTab('map');
                
                // Allow DOM to update (display:flex on map container) before measuring
                requestAnimationFrame(() => {
                    const img = document.getElementById('map-image');
                    const wrapper = document.getElementById('panzoom-wrapper');
                    const wrapperRect = wrapper.getBoundingClientRect();
                    
                    const pxX = (target.x / 100) * img.naturalWidth;
                    const pxY = (target.y / 100) * img.naturalHeight;
                    
                    // Show pulse
                    const pulse = document.getElementById('pulse-marker');
                    pulse.style.left = `${pxX}px`;
                    pulse.style.top = `${pxY}px`;
                    pulse.classList.remove('hidden');
                    
                    // Correct Panzoom Centering Logic
                    const scale = 2.5; // Zoom depth
                    
                    // We want point (pxX * scale, pxY * scale) to be in the middle of wrapperRect
                    const panX = (wrapperRect.width / 2) - (pxX * scale);
                    const panY = (wrapperRect.height / 2) - (pxY * scale);

                    panzoomInstance.zoom(scale, { animate: true });
                    setTimeout(() => {
                        panzoomInstance.pan(panX, panY, { animate: true });
                    }, 50);

                    setTimeout(() => { pulse.classList.add('hidden'); }, 3000);
                });
            } else {
                alert(`Locatie '${boothLabel}' (nog) niet gevonden. OCR zoekt mogelijk nog op de achtergrond.`);
            }
        }

        function handleMapClick(e) {
            const img = document.getElementById('map-image');
            if(img.classList.contains('hidden')) return;

            const rect = img.getBoundingClientRect();
            const scaleX = img.naturalWidth / rect.width;
            const scaleY = img.naturalHeight / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;
            const pctX = (clickX / img.naturalWidth) * 100;
            const pctY = (clickY / img.naturalHeight) * 100;

            const hallOcr = ocrCache[currentHall] || {};
            let clickedLabel = null;

            for (const [text, box] of Object.entries(hallOcr)) {
                const padW = box.w * 0.4; 
                const padH = box.h * 0.4;
                if (pctX >= (box.x - padW) && pctX <= (box.x + box.w + padW) && 
                    pctY >= (box.y - padH) && pctY <= (box.y + box.h + padH)) {
                    clickedLabel = text;
                    break;
                }
            }

            if (clickedLabel) {
                const matchedGames = games.filter(g => 
                    g.hall === currentHall && g.boothLabel && 
                    (clickedLabel.includes(g.boothLabel.replace(/[^a-zA-Z0-9]/g, '')) || 
                     g.boothLabel.replace(/[^a-zA-Z0-9]/g, '').includes(clickedLabel))
                );
                if(matchedGames.length > 0) showModal(matchedGames);
            }
        }

        function showModal(matchedGames) {
            const content = document.getElementById('modal-content');
            content.innerHTML = '';
            document.getElementById('modal-title').innerText = `Stands: ${matchedGames[0].boothLabel}`;

            matchedGames.forEach(game => {
                const styles = getPrioStyles(game.priority);
                const isVisited = visited.includes(game.id);
                const savedNote = userNotes[game.id] !== undefined ? userNotes[game.id] : game.notes;

                const div = document.createElement('div');
                div.className = `p-3 rounded border ${styles.bg} ${styles.border} ${isVisited ? 'opacity-50 grayscale bg-white' : ''}`;
                div.innerHTML = `
                    <div class="flex items-start gap-2">
                        <input type="checkbox" ${isVisited ? 'checked' : ''} onchange="toggleVisitedModal('${game.id}')" id="mod-chk-${game.id}" class="mt-1 w-5 h-5 cursor-pointer">
                        <div class="flex-1">
                            <h4 class="font-bold ${isVisited ? 'strike' : ''}" id="mod-title-${game.id}">${game.name}</h4>
                            <p class="text-xs text-slate-600 mb-2">${game.publisher}</p>
                            <span class="text-xs px-2 py-1 rounded bg-white/60 border font-bold">${game.priority}</span>
                            <textarea onchange="saveNote('${game.id}', this.value)" class="w-full mt-2 text-sm p-2 border rounded bg-white/80" rows="2">${savedNote}</textarea>
                        </div>
                    </div>
                `;
                content.appendChild(div);
            });
            document.getElementById('booth-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('booth-modal').classList.add('hidden'); }
        function toggleVisitedModal(id) {
            toggleVisited(id);
            const isVis = visited.includes(id);
            const titleEl = document.getElementById(`mod-title-${id}`);
            const parentEl = titleEl.closest('.p-3');
            if(isVis) {
                titleEl.classList.add('strike'); parentEl.classList.add('opacity-50', 'grayscale', 'bg-white');
            } else {
                titleEl.classList.remove('strike'); parentEl.classList.remove('opacity-50', 'grayscale', 'bg-white');
            }
        }

        // --- Multi-Pass Deep OCR ---
        async function checkAndRunAdvancedOCR() {
            if (isOcrRunning) return;
            isOcrRunning = true;
            
            const worker = await Tesseract.createWorker('eng');
            await worker.setParameters({
                tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
                tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT,
            });

            for (let i = 1; i <= 8; i++) {
                const hId = i.toString();
                // Get unique required booth strings for this hall
                const requiredBooths = [...new Set(games.filter(g => g.hall === hId && g.boothLabel)
                                       .map(g => g.boothLabel.replace(/[^a-zA-Z0-9]/g, '')))];
                
                if (requiredBooths.length === 0) continue; // Skip empty halls
                if (!ocrCache[hId]) ocrCache[hId] = {};

                let methodsTried = 0;
                
                // Advanced loop up to 10 filters
                while (methodsTried < ocrFilters.length) {
                    // Calculate success rate
                    let foundCount = 0;
                    for (const reqBooth of requiredBooths) {
                        for (const key of Object.keys(ocrCache[hId])) {
                            if (key.includes(reqBooth) || reqBooth.includes(key)) {
                                foundCount++; break;
                            }
                        }
                    }
                    
                    const successRate = foundCount / requiredBooths.length;
                    document.getElementById('ocr-status').classList.remove('hidden');
                    document.getElementById('txt-scanning').innerText = `OCR Hal ${hId}: ${Math.round(successRate * 100)}% (poging ${methodsTried+1})`;

                    if (successRate >= 0.90) break; // 90% reached! Stop processing this hall.

                    try {
                        const tempImg = new Image();
                        tempImg.src = `hal${hId}.png`;
                        await new Promise(resolve => tempImg.onload = resolve);
                        
                        const cvs = document.createElement('canvas');
                        cvs.width = tempImg.width * 2; // Upscale 2x
                        cvs.height = tempImg.height * 2;
                        const ctx = cvs.getContext('2d');
                        
                        // Apply iterative filter
                        ctx.filter = ocrFilters[methodsTried];
                        ctx.drawImage(tempImg, 0, 0, cvs.width, cvs.height);

                        const ret = await worker.recognize(cvs);
                        
                        // Merge new findings
                        ret.data.words.forEach(word => {
                            const text = word.text.replace(/[^A-Z0-9]/g, '');
                            if (text.length >= 2 && /[A-Z]/.test(text) && /\d/.test(text)) {
                                // Only save if we don't have it, or overwrite if confidence might be better (simplified to just append)
                                if (!ocrCache[hId][text]) {
                                    ocrCache[hId][text] = {
                                        x: (word.bbox.x0 / cvs.width) * 100,
                                        y: (word.bbox.y0 / cvs.height) * 100,
                                        w: ((word.bbox.x1 - word.bbox.x0) / cvs.width) * 100,
                                        h: ((word.bbox.y1 - word.bbox.y0) / cvs.height) * 100
                                    };
                                }
                            }
                        });

                        localStorage.setItem('spielOcrCacheV4', JSON.stringify(ocrCache));
                        
                        // Redraw if this is the current active hall
                        if (currentHall === hId) {
                            renderList(); 
                            drawOverlay();
                        }
                    } catch (err) {
                        console.error(`OCR Filter error on Hall ${hId}`, err);
                    }
                    
                    methodsTried++;
                }
            }

            await worker.terminate();
            isOcrRunning = false;
            document.getElementById('ocr-status').classList.add('hidden');
        }

        function drawOverlay() {
            const cvs = document.getElementById('map-overlay');
            const img = document.getElementById('map-image');
            if (img.classList.contains('hidden') || !ocrCache[currentHall]) return;

            const ctx = cvs.getContext('2d');
            ctx.clearRect(0, 0, cvs.width, cvs.height);
            
            const hideChecked = document.getElementById('hide-visited').checked;
            const currentPrio = document.getElementById('prio-filter').value;
            
            const hallGames = games.filter(g => 
                g.hall === currentHall && 
                (!hideChecked || !visited.includes(g.id)) &&
                (currentPrio === 'All' || g.priority === currentPrio)
            );

            hallGames.forEach(game => {
                if (!game.boothLabel) return;
                const searchStr = game.boothLabel.replace(/[^a-zA-Z0-9]/g, '');
                
                for (const [text, box] of Object.entries(ocrCache[currentHall])) {
                    if (text.includes(searchStr) || searchStr.includes(text)) {
                        const pxX = (box.x / 100) * cvs.width;
                        const pxY = (box.y / 100) * cvs.height;
                        const pxW = (box.w / 100) * cvs.width;
                        const pxH = (box.h / 100) * cvs.height;

                        const padW = pxW * 0.4;
                        const padH = pxH * 0.4;

                        ctx.fillStyle = getPrioStyles(game.priority).hex;
                        ctx.fillRect(pxX - padW, pxY - padH, pxW + (padW*2), pxH + (padH*2));
                        
                        ctx.strokeStyle = getPrioStyles(game.priority).hex.replace('0.4', '1.0');
                        ctx.lineWidth = 2;
                        ctx.strokeRect(pxX - padW, pxY - padH, pxW + (padW*2), pxH + (padH*2));
                        break;
                    }
                }
            });
        }
    </script>
