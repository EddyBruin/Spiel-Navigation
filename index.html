<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPIEL Navigator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style id="dynamic-styles"></style>
    <style>
        body { overscroll-behavior-y: contain; }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        
        /* Split screen mode on desktop and landscape mobile */
        @media (min-width: 768px), (max-height: 600px) and (orientation: landscape) {
            .mobile-tabs { display: none !important; }
            #sidebar { display: block !important; width: 35% !important; position: relative !important; }
            #map-container { display: flex !important; width: 65% !important; position: relative !important; }
        }

        .strike { text-decoration: line-through; opacity: 0.5; }
        
        /* Red Pulse Marker */
        .pulse { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-ring { 
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; border-width: 12px; } 
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.8; border-width: 4px; } 
            100% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; border-width: 12px; } 
        }
        
        input[type="checkbox"].styled-chk {
            width: 1.25rem; height: 1.25rem;
            cursor: pointer; border-radius: 0.25rem;
            accent-color: #3b82f6;
        }

        /* Map Cursor */
        #panzoom-wrapper { cursor: grab; }
        #panzoom-wrapper:active { cursor: grabbing; }
        
        /* Booth Grid Overlays */
        .booth-group {
            display: grid;
            grid-template-columns: repeat(3, min-content);
            justify-content: start;
        }
        .game-label { display: none; }
        
        .show-labels .booth-group { grid-template-columns: 1fr; }
        .show-labels .game-label { display: block; }
        
        /* Vertical Text for Hall label */
        .vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            text-align: center;
        }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans overflow-hidden text-slate-800">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-3 shadow-md flex justify-between items-center z-20 shrink-0">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-map-location-dot text-blue-400"></i>
                <span id="txt-title" class="hidden sm:inline">SPIEL Nav</span>
            </h1>
            
            <!-- Quick Toggles in Header -->
            <div class="flex gap-2 text-xs">
                <button id="btn-toggle-hide" onclick="toggleHideVisited()" class="px-3 py-1.5 rounded-full font-bold transition-colors bg-blue-600 text-white shadow-sm border border-blue-700">
                    <i class="fa-solid fa-eye-slash mr-1"></i> <span id="txt-btn-hide">Afgevinkt</span>
                </button>
                <button id="btn-toggle-notes" onclick="toggleShowNotes()" class="px-3 py-1.5 rounded-full font-bold transition-colors bg-slate-700 text-slate-200 shadow-sm border border-slate-600">
                    <i class="fa-solid fa-comment mr-1"></i> <span id="txt-btn-notes">Notities</span>
                </button>
            </div>
        </div>
        
        <!-- Language Toggle -->
        <div class="flex items-center gap-1 text-xs bg-slate-800 rounded p-1 shrink-0">
            <button onclick="setLang('nl')" id="lang-nl" class="px-2 py-1 rounded font-bold transition-colors">NL</button>
            <button onclick="setLang('en')" id="lang-en" class="px-2 py-1 rounded font-bold transition-colors">EN</button>
            <button onclick="setLang('de')" id="lang-de" class="px-2 py-1 rounded font-bold transition-colors">DE</button>
        </div>
    </header>

    <!-- Mobile View Tabs -->
    <div class="mobile-tabs flex bg-white border-b shrink-0 shadow-sm z-10">
        <button onclick="switchTab('list')" id="tab-list" class="flex-1 py-3 text-center tab-active text-slate-600 transition-colors">
            <i class="fa-solid fa-list mr-1"></i> <span id="txt-tab-list">Lijst</span>
        </button>
        <button onclick="switchTab('map')" id="tab-map" class="flex-1 py-3 text-center text-slate-600 transition-colors">
            <i class="fa-solid fa-map mr-1"></i> <span id="txt-tab-map">Kaart</span>
        </button>
    </div>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- Sidebar / List -->
        <div id="sidebar" class="w-full bg-slate-50 border-r h-full z-10 absolute md:relative inset-0 overflow-y-auto pb-24 md:pb-4 block">
            
            <!-- Controls: Priority Filters -->
            <div class="p-3 border-b bg-white shadow-sm" id="prio-filters">
                <div class="flex gap-2 text-xs font-bold">
                    <button onclick="togglePriority('Need')" id="btn-prio-Need" class="flex-1 py-2 px-1 rounded-lg transition shadow-sm border border-green-500 bg-green-100 text-green-800">Need</button>
                    <button onclick="togglePriority('Want')" id="btn-prio-Want" class="flex-1 py-2 px-1 rounded-lg transition shadow-sm border border-blue-500 bg-blue-100 text-blue-800">Want</button>
                    <button onclick="togglePriority('Like')" id="btn-prio-Like" class="flex-1 py-2 px-1 rounded-lg transition shadow-sm border border-yellow-400 bg-yellow-100 text-yellow-800">Like</button>
                    <button onclick="togglePriority('Maybe')" id="btn-prio-Maybe" class="flex-1 py-2 px-1 rounded-lg transition shadow-sm border border-gray-400 bg-gray-100 text-gray-800">Maybe</button>
                </div>
            </div>

            <!-- Hall Tabs met Verticale Label -->
            <div class="flex items-stretch border-b bg-slate-100 shadow-inner">
                <div class="bg-slate-300 px-1.5 py-2 flex items-center justify-center border-r border-slate-300">
                    <span id="txt-hall-lbl" class="vertical-text text-[10px] font-black text-slate-600 uppercase tracking-widest">HAL</span>
                </div>
                <div class="flex flex-wrap gap-1.5 p-2 flex-1 items-center" id="hall-tabs">
                    <!-- Generated by JS -->
                </div>
            </div>

            <!-- List -->
            <ul id="game-list" class="p-2 space-y-2 bg-slate-50"></ul>
        </div>

        <!-- Map Area -->
        <div id="map-container" class="w-full bg-slate-200 hidden flex-col relative h-full absolute inset-0 overflow-hidden shadow-inner">
            <div class="absolute inset-0" id="panzoom-wrapper" style="touch-action: none;">
                <div id="panzoom-element" class="relative w-full h-full" style="transform-origin: 0 0;">
                    
                    <div id="map-error" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 hidden z-0">
                        <i class="fa-solid fa-image text-4xl mb-2"></i>
                        <p>Afbeelding niet gevonden.</p>
                    </div>

                    <img id="map-image" src="" class="absolute top-0 left-0 max-w-none bg-white hidden z-10" style="box-shadow: 0 0 20px rgba(0,0,0,0.1);">
                    
                    <div id="html-overlays" class="absolute top-0 left-0 w-full h-full z-20 pointer-events-none"></div>
                    
                    <!-- Rode Focus Pulse Marker -->
                    <div id="pulse-marker" class="absolute border-red-500 rounded-full pulse hidden pointer-events-none bg-red-500/30 flex items-center justify-center z-30" style="width: 180px; height: 180px; transform: translate(-50%, -50%);">
                        <div class="w-5 h-5 bg-red-600 rounded-full shadow-xl border-2 border-white"></div>
                    </div>
                </div>
            </div>
            
            <!-- Map Controls -->
            <div class="absolute bottom-6 right-6 flex flex-col gap-3 z-40">
                <button onclick="zoomIn()" class="bg-white w-12 h-12 rounded-full shadow-xl text-slate-700 hover:text-blue-600 transition border flex items-center justify-center text-lg"><i class="fa-solid fa-plus"></i></button>
                <button onclick="zoomOut()" class="bg-white w-12 h-12 rounded-full shadow-xl text-slate-700 hover:text-blue-600 transition border flex items-center justify-center text-lg"><i class="fa-solid fa-minus"></i></button>
                <button onclick="fitMap()" class="bg-white w-12 h-12 rounded-full shadow-xl text-slate-700 hover:text-blue-600 transition border flex items-center justify-center text-lg"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>
    </main>

    <!-- Modal for Map Clicks -->
    <div id="booth-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-slate-50 rounded-xl shadow-2xl w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden">
            <div class="p-3 border-b flex justify-between items-center bg-white shadow-sm z-10">
                <h3 class="font-bold text-lg flex items-center gap-2 text-slate-800">
                    <i class="fa-solid fa-store text-blue-500"></i>
                    <span id="modal-title">Stands</span>
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-800 transition p-2"><i class="fa-solid fa-xmark fa-xl"></i></button>
            </div>
            <div class="p-3 overflow-y-auto flex-1 space-y-3" id="modal-content"></div>
        </div>
    </div>

    <!-- Error/Upload Overlay -->
    <div id="upload-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <div class="bg-blue-100 text-blue-600 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-file-csv text-4xl"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2 text-slate-800" id="txt-upload-title">Data niet gevonden</h2>
            <p class="text-sm text-slate-600 mb-6" id="txt-upload-desc">Laad handmatig je CSV bestand in om te beginnen.</p>
            <input type="file" id="csv-file" accept=".csv" class="hidden">
            <label for="csv-file" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold cursor-pointer block hover:bg-blue-700 transition shadow-lg">Kies Bestand</label>
        </div>
    </div>

        document.addEventListener('DOMContentLoaded', () => {
            initPanzoom();

            updateToggleUI();
            attemptAutoLoadCSV();

        function setLang(l) {
            lang = l;
            document.querySelectorAll('#lang-nl, #lang-en, #lang-de').forEach(el => el.classList.remove('bg-blue-600', 'text-white'));
            document.getElementById(`lang-${l}`).classList.add('bg-blue-600', 'text-white');
            
            document.getElementById('txt-title').innerText = i18n[l].title;
            document.getElementById('txt-tab-list').innerText = i18n[l].tabList;
            document.getElementById('txt-tab-map').innerText = i18n[l].tabMap;
            document.getElementById('txt-btn-hide').innerText = i18n[l].hideVisited;
            document.getElementById('txt-btn-notes').innerText = i18n[l].showNotes;
            document.getElementById('txt-hall-lbl').innerText = i18n[l].hallLabel;
            document.getElementById('txt-upload-title').innerText = i18n[l].uploadTitle;
            document.getElementById('txt-upload-desc').innerText = i18n[l].uploadDesc;
            
            if (games.length > 0) { renderHallTabs(); renderList(); }
        }

        function attemptAutoLoadCSV() {
            fetch('data.csv')
                .then(r => { if (!r.ok) throw new Error(); return r.text(); })
                .then(processCSV)
                .catch(() => document.getElementById('upload-overlay').classList.remove('hidden'));
        }

        document.getElementById('csv-file').addEventListener('change', e => {
            if (e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = evt => processCSV(evt.target.result);
                reader.readAsText(e.target.files[0]);
            }
        });

        function processCSV(csvText) {
            document.getElementById('upload-overlay').classList.add('hidden');
            Papa.parse(csvText, {
                header: true, skipEmptyLines: true,
                complete: results => {
                    games = results.data.map((row, idx) => {
                        const hall = row['hall'] ? row['hall'].replace('.0', '').trim() : '';
                        const booth = row['booth'] ? row['booth'].trim() : '';
                        return {
                            id: `g_${idx}`,
                            name: row['name'],
                            publisher: row['publishers'],
                            hall: hall,
                            boothLabel: hall && booth ? `${hall}${booth}` : '',
                            priority: row['priority'],
                            preorder: row['preorder'] === '1',
                            notes: row['notes'] || ''
                        };
                    });
                    
                    games.sort((a, b) => {
                        if (prioOrder[a.priority] !== prioOrder[b.priority]) return (prioOrder[a.priority] || 9) - (prioOrder[b.priority] || 9);
                        if (a.hall !== b.hall) return a.hall.localeCompare(b.hall);
                        return a.boothLabel.localeCompare(b.boothLabel);
                    });

                    currentHall = '1';
                    renderHallTabs();
                    renderList();
                    loadMapImage();
                }
            });
        }

        function getPrioStyles(prio) {
            switch(prio) {
                case 'Need': return { borderClass: 'border-green-500', bgClass: 'bg-green-100', hex: '#22c55e', hexTrans: 'rgba(34, 197, 94, 0.7)' };
                case 'Want': return { borderClass: 'border-blue-500', bgClass: 'bg-blue-100', hex: '#3b82f6', hexTrans: 'rgba(59, 130, 246, 0.7)' };
                case 'Like': return { borderClass: 'border-yellow-400', bgClass: 'bg-yellow-100', hex: '#eab308', hexTrans: 'rgba(234, 179, 8, 0.7)' };
                case 'Maybe': return { borderClass: 'border-gray-400', bgClass: 'bg-gray-100', hex: '#9ca3af', hexTrans: 'rgba(156, 163, 175, 0.7)' };
                default: return { borderClass: 'border-slate-300', bgClass: 'bg-white', hex: '#94a3b8', hexTrans: 'rgba(148, 163, 184, 0.7)' };
            }
        }

        function togglePriority(prio) {
            if (activePriorities.includes(prio)) {
                activePriorities = activePriorities.filter(p => p !== prio);
            } else {
                activePriorities.push(prio);
            }
            renderPrioFilters();
            renderHallTabs();
            renderList();
            renderHTMLOverlays();
        }

        function renderPrioFilters() {
            ['Need', 'Want', 'Like', 'Maybe'].forEach(prio => {
                const btn = document.getElementById(`btn-prio-${prio}`);
                if (activePriorities.includes(prio)) {
                    btn.classList.remove('opacity-50', 'grayscale', 'bg-gray-100', 'text-gray-500', 'border-gray-300');
                    if(prio==='Need') btn.classList.add('bg-green-100', 'text-green-800', 'border-green-500');
                    if(prio==='Want') btn.classList.add('bg-blue-100', 'text-blue-800', 'border-blue-500');
                    if(prio==='Like') btn.classList.add('bg-yellow-100', 'text-yellow-800', 'border-yellow-400');
                    if(prio==='Maybe') btn.classList.add('bg-gray-200', 'text-gray-800', 'border-gray-400');
                } else {
                    btn.className = `flex-1 py-2 px-1 rounded-lg transition shadow-sm border border-gray-300 bg-gray-100 text-gray-500 opacity-50 grayscale`;
                }
            });
        }

        function toggleHideVisited() {
            stateHideVisited = !stateHideVisited;
            updateToggleUI();
            renderHallTabs(); 
            renderList(); 
            renderHTMLOverlays();
        }

        function toggleShowNotes() {
            stateShowNotes = !stateShowNotes;
            updateToggleUI();
            renderList();
        }

            const btnHide = document.getElementById('btn-toggle-hide');
            if (stateHideVisited) {
                btnHide.className = "px-3 py-1.5 rounded-full font-bold transition-colors bg-blue-600 text-white shadow-sm border border-blue-700";

                }

                const li = document.createElement('li');
                li.className = `relative py-2 px-3 rounded-xl border-2 border-l-[6px] shadow-sm transition-all ${bgClass} cursor-pointer hover:shadow-md`;
                li.onclick = () => toggleNote(game.id);
                li.innerHTML = `
                    <div class="flex items-start gap-3">
                        <input type="checkbox" ${isVis ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleVis('${game.id}')" class="mt-1 styled-chk shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-start justify-between mb-0.5">
                                <h3 class="font-bold text-[0.95rem] text-slate-800 pr-16 leading-tight ${isVis ? 'strike' : ''}">${game.name}</h3>
                                <div class="absolute top-2 right-2 flex gap-1.5 items-center">
                                    ${game.preorder ? '<i class="fa-solid fa-money-bill-wave text-green-600" title="Preorder"></i>' : ''}
                                    <button onclick="focusMap('${game.boothLabel}'); event.stopPropagation();" class="text-[10px] px-2 py-1 rounded shadow-sm border font-bold transition hover:opacity-80 ${locationBadge}">
                                        <i class="fa-solid fa-location-dot mr-1"></i>${game.boothLabel}
                                    </button>
                                </div>
                            </div>
                            <p class="text-[11px] text-slate-600 truncate"><i class="fa-solid fa-building mr-1"></i> ${game.publisher}</p>
                            
                            <textarea id="note-${game.id}" onchange="saveNote('${game.id}', this.value)" onclick="event.stopPropagation()" class="w-full mt-2 text-xs p-2 border border-slate-200 rounded-lg bg-white/80 outline-none focus:ring-2 focus:ring-blue-500 transition shadow-inner ${stateShowNotes ? '' : 'hidden'}" rows="2" placeholder="${i18n[lang].notes}">${note}</textarea>
                        </div>
                    </div>`;
                list.appendChild(li);
            });
            if(count === 0) list.innerHTML = `<li class="p-6 text-center text-slate-500 italic bg-white rounded-xl border border-slate-200">${i18n[lang].noGames}</li>`;
        }

        function toggleVis(id) {
            visited = visited.includes(id) ? visited.filter(v => v !== id) : [...visited, id];
            localStorage.setItem('spielVisited', JSON.stringify(visited));
            renderHallTabs(); 
            renderList(); 
            renderHTMLOverlays();
        }

        function toggleNote(id) {
            if(!stateShowNotes) {
                document.getElementById(`note-${id}`).classList.toggle('hidden');
            }
        }
        function saveNote(id, val) { userNotes[id] = val; localStorage.setItem('spielNotes', JSON.stringify(userNotes)); }

        function switchTab(tab) {
            document.getElementById('tab-list').classList.toggle('tab-active', tab === 'list');
            document.getElementById('tab-list').classList.toggle('text-slate-600', tab !== 'list');
            document.getElementById('tab-map').classList.toggle('tab-active', tab === 'map');
            document.getElementById('tab-map').classList.toggle('text-slate-600', tab !== 'map');
            
            // Only apply display overrides if we are in portrait mobile mode
            if (window.getComputedStyle(document.querySelector('.mobile-tabs')).display !== 'none') {
                document.getElementById('sidebar').style.display = tab === 'list' ? 'block' : 'none';
                document.getElementById('map-container').style.display = tab === 'map' ? 'flex' : 'none';
                if(tab === 'map') {
                    requestAnimationFrame(() => fitMap());
                }
            }
        }

        function setupEventListeners() {
            window.addEventListener('resize', () => {
                if (window.getComputedStyle(document.querySelector('.mobile-tabs')).display === 'none') {
                    document.getElementById('sidebar').style.display = '';
                    document.getElementById('map-container').style.display = '';
                } else {
                    const isList = document.getElementById('tab-list').classList.contains('tab-active');
                    document.getElementById('sidebar').style.display = isList ? 'block' : 'none';
                    document.getElementById('map-container').style.display = isList ? 'none' : 'flex';
                }
                
                requestAnimationFrame(fitMap);
            });

            // Map Drag Detection
            const wrap = document.getElementById('panzoom-wrapper');
            wrap.addEventListener('panzoompan', () => { isDraggingMap = true; });
            wrap.addEventListener('pointerdown', () => { isDraggingMap = false; });
        }

        // --- Map Zoom & Focus ---
        function initPanzoom() {
            const el = document.getElementById('panzoom-element');
            // Cursor set to default so it doesn't force a crosshair/move icon
            panzoomInstance = Panzoom(el, { maxScale: 8, minScale: 0.1, contain: 'none', startScale: 1, cursor: 'default' });
            
            el.parentElement.addEventListener('wheel', panzoomInstance.zoomWithWheel);
            el.addEventListener('panzoomzoom', (e) => {
                currentScale = e.detail.scale;
                updateDynamicStyles();
            });
        }

        function getFitScale() {
            const img = document.getElementById('map-image');
            const wrap = document.getElementById('panzoom-wrapper');
            if(!img || img.classList.contains('hidden') || wrap.clientWidth === 0) return 1;
            const scaleX = wrap.clientWidth / img.naturalWidth;
            const scaleY = wrap.clientHeight / img.naturalHeight;
            return Math.min(scaleX, scaleY) * 0.98;
        }

        function fitMap(callback) {
            const img = document.getElementById('map-image');
            const wrap = document.getElementById('panzoom-wrapper');
            if(!img || img.classList.contains('hidden')) return;
            if (wrap.clientWidth === 0) {
                requestAnimationFrame(() => fitMap(callback));
                return;
            }
            
            const fitScale = getFitScale();
            panzoomInstance.zoom(fitScale, { animate: true });
            
            const panX = (wrap.clientWidth - (img.naturalWidth * fitScale)) / 2;
            const panY = (wrap.clientHeight - (img.naturalHeight * fitScale)) / 2;

            setTimeout(() => {
                panzoomInstance.pan(panX, panY, { animate: true, force: true });
                currentScale = fitScale;
                updateDynamicStyles();
                if(callback) callback(fitScale);
            }, 10);
        }

        function zoomIn() { panzoomInstance.zoomIn(); }
        function zoomOut() { panzoomInstance.zoomOut(); }

        function loadMapImage() {
            const img = document.getElementById('map-image');
            const err = document.getElementById('map-error');
            
            img.onload = () => {
                img.classList.remove('hidden');
                err.classList.add('hidden');
                
                const wrap = document.getElementById('panzoom-element');
                wrap.style.width = `${img.naturalWidth}px`; 
                wrap.style.height = `${img.naturalHeight}px`;

                fitMap();
                renderHTMLOverlays();
            };
            
            img.onerror = () => {
                img.classList.add('hidden');
                err.classList.remove('hidden');
                document.getElementById('html-overlays').innerHTML = '';
            };
            
            img.src = `hal${currentHall}.png`;
        }

        function focusMap(boothLabel) {
            if(!boothLabel) return;
            const searchStr = boothLabel.replace(/[^a-zA-Z0-9]/g, '');
            const hallData = pdfBoothData[currentHall] || {};
            const target = Object.entries(hallData).find(([k]) => k.includes(searchStr) || searchStr.includes(k))?.[1];

            if(target) {
                switchTab('map');
                
                const executeFocus = () => {
                    const wrap = document.getElementById('panzoom-wrapper');
                    const img = document.getElementById('map-image');
                    
                    if (wrap.clientWidth === 0 || img.naturalWidth === 0) {
                        requestAnimationFrame(executeFocus);
                        return;
                    }
                    
                    // Doel zoom (inzoomen om de locatie goed te zien)
                    const targetScale = getFitScale() * 3.0; 
                    
                    const pxX = (target.x / 100) * img.naturalWidth;
                    const pxY = (target.y / 100) * img.naturalHeight;
                    
                    const pulse = document.getElementById('pulse-marker');
                    pulse.style.left = `${pxX}px`; 
                    pulse.style.top = `${pxY}px`;
                    
                    // Zoom in
                    panzoomInstance.zoom(targetScale, { animate: true });
                    
                    // Calculate pan to put pxX,pxY exactly in center of wrapper
                    const panX = (wrap.clientWidth / 2) - (pxX * targetScale);
                    const panY = (wrap.clientHeight / 2) - (pxY * targetScale);

                    setTimeout(() => {
                        panzoomInstance.pan(panX, panY, { animate: true, force: true });
                        currentScale = targetScale;
                        updateDynamicStyles();
                        
                        pulse.classList.remove('hidden');
                        setTimeout(() => pulse.classList.add('hidden'), 7000);
                    }, 50);
                };
                requestAnimationFrame(executeFocus);
            } else {
                alert(`Locatie '${boothLabel}' niet gevonden in de PDF data.`);
            }
        }

        // --- HTML DOM OVERLAYS ---
        function renderHTMLOverlays() {
            const container = document.getElementById('html-overlays');
            container.innerHTML = '';
            const img = document.getElementById('map-image');
            if (img.classList.contains('hidden') || !pdfBoothData[currentHall]) return;

            let boothGroupsMap = {}; 
            
            const hGames = games.filter(g => g.hall === currentHall && !visited.includes(g.id) && activePriorities.includes(g.priority));

            hGames.forEach(g => {
                if (!g.boothLabel) return;
                const searchStr = g.boothLabel.replace(/[^a-zA-Z0-9]/g, '');
                const match = Object.entries(pdfBoothData[currentHall]).find(([k]) => k.includes(searchStr) || searchStr.includes(k));
                if (match) {
                    const key = match[0];
                    if (!boothGroupsMap[key]) boothGroupsMap[key] = { box: match[1], games: [] };
                    boothGroupsMap[key].games.push(g);
                }
            });

            Object.entries(boothGroupsMap).forEach(([boothKey, group]) => {
                const box = group.box;
                
                const groupDiv = document.createElement('div');
                groupDiv.className = 'absolute booth-group pointer-events-auto';
                groupDiv.style.left = `${box.x}%`;
                // Tight vertical spacing directly below the booth text
                groupDiv.style.top = `calc(${box.y + box.h}% + 1px)`;
                
                const gameIdsStr = group.games.map(g => g.id).join(',');
                const label = group.games[0].boothLabel;

                let htmlContent = '';
                group.games.forEach(g => {
                    const styles = getPrioStyles(g.priority);
                    htmlContent += `
                        <div class="flex items-center gap-1 cursor-pointer transition-transform hover:scale-110" onclick="handleOverlayClick('${gameIdsStr}', '${label}', event)">
                            <div class="dot-marker rounded-full border-2 border-white shadow-sm" style="background-color: ${styles.hexTrans}; border-color: ${styles.hex}"></div>
                            <span class="game-label text-[11px] font-bold text-slate-800 bg-white/95 px-1.5 py-0.5 rounded shadow-md whitespace-nowrap border border-slate-300 ml-1">${g.name}</span>
                        </div>
                    `;
                });

                groupDiv.innerHTML = htmlContent;
                container.appendChild(groupDiv);
            });

            updateDynamicStyles(); 
        }

        function updateDynamicStyles() {
            const styleEl = document.getElementById('dynamic-styles');
            const overlays = document.getElementById('html-overlays');
            
            const fitScale = getFitScale();
            
            // At zoom level 1x (fitScale), we want dots to be big (e.g. 18px visual)
            // Visual size = CSS size * currentScale -> CSS size = Visual Size / currentScale
            let desiredVisualSize = Math.max(10, 18 - ((currentScale - fitScale) * 2));
            let cssSize = desiredVisualSize / currentScale;
            
            let textCss = Math.max(8, 14 / currentScale);
            let borderCss = Math.max(0.5, 2 / currentScale);

            styleEl.innerHTML = `
                .dot-marker {
                    width: ${cssSize}px;
                    height: ${cssSize}px;
                    border-width: ${borderCss}px;
                }
                .game-label { 
                    font-size: ${textCss}px; 
                    border-width: ${borderCss}px;
                    border-radius: ${4/currentScale}px;
                }
            `;

            if (!overlays) return;
            
            if (currentScale > fitScale * 2.5) {
                overlays.classList.add('show-labels');
            } else {
                overlays.classList.remove('show-labels');
            }
        }

        window.handleOverlayClick = function(gameIdsStr, boothLabel, event) {
            event.stopPropagation();
            if (isDraggingMap) return; 
            
            const ids = gameIdsStr.split(',');
            const matchGames = games.filter(g => ids.includes(g.id));
            if(matchGames.length > 0) {
                showModal(matchGames, boothLabel);
            }
        };

        function showModal(matchGames, boothLabel) {
            const content = document.getElementById('modal-content');
            content.innerHTML = '';
            document.getElementById('modal-title').innerText = `${boothLabel}`;

            matchGames.forEach(game => {
                const isVis = visited.includes(game.id);
                const note = userNotes[game.id] !== undefined ? userNotes[game.id] : game.notes;
                const styles = getPrioStyles(game.priority);
                const bgClass = isVis ? 'bg-slate-50 opacity-50 grayscale border-slate-300' : `${styles.bgClass} ${styles.borderClass}`;

                content.innerHTML += `
                    <div class="p-3 rounded-xl border-2 border-l-[6px] shadow-sm mb-3 ${bgClass}">
                        <div class="flex items-start gap-3">
                            <input type="checkbox" ${isVis ? 'checked' : ''} onchange="toggleVis('${game.id}'); closeModal();" class="mt-1 styled-chk">
                            <div class="flex-1">
                                <div class="flex justify-between items-center mb-1">
                                    <h4 class="font-bold text-lg text-slate-800 pr-10 ${isVis ? 'strike' : ''}">${game.name}</h4>
                                    ${game.preorder ? '<i class="fa-solid fa-money-bill-wave text-green-600 text-xl"></i>' : ''}
                                </div>
                                <p class="text-xs text-slate-600 mb-2"><i class="fa-solid fa-building mr-1"></i> ${game.publisher}</p>
                                <textarea onchange="saveNote('${game.id}', this.value)" class="w-full mt-2 text-sm p-3 border border-slate-200 rounded-lg bg-white/80 focus:ring-2 focus:ring-blue-500 outline-none shadow-inner" rows="2" placeholder="${i18n[lang].notes}">${note}</textarea>
                            </div>
                        </div>
                    </div>`;
            });
            document.getElementById('booth-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('booth-modal').classList.add('hidden'); }
    </script>
</body>
</html>
